name: CI

# Not: Bu iş akışı yazıldığı ortamda GitHub'a itilmediği için
# ÇALIŞTIRILMAMIŞTIR. Yerelde aynı üç komut çalıştırıldı ve geçti.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
