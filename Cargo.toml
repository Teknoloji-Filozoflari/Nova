[package]
name = "nova"
version = "0.1.0"
edition = "2021"
description = "A TUI launcher for terminal applications on Linux"
authors = ["Nova Contributors"]
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
which = "8.0.6"
# Mağaza kurulumu: SHA-256 doğrulama, güvenli tar.gz çıkarma ve HTTP indirme.
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
# GitHub Releases API yanıtının okunması (canlı sürüm takibi).
serde_json = "1"
# rustls transitif; 1.9+ edition2024 ister — Rust 1.83 CI ile uyum için pin.
zeroize = "=1.8.1"
minisign-verify = "0.3"

[dev-dependencies]
# Gerçek terminal/Konsole başlatmayan testler için ek paket gerekmiyor; sahte
# adapterler test dosyalarının içinde tanımlıdır.

[[bin]]
name = "nova"
path = "src/main.rs"

[[bin]]
name = "capture-screens"
path = "tools/capture_screens.rs"
doc = false

[workspace]
