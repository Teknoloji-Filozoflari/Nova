# Nova mağaza kataloğu — daily
#
# Kategori: "Günlük"
# `assets/store/` altında; loader tüm kategori dosyalarını birleştirir.
# Kullanıcı düzenlemez. download_archive için https + SHA-256 zorunlu.

[[apps]]
id = "tldr"
name = "tldr"
category = "Günlük"
description = "Komutların kısa ve örnekli kullanım özetlerini gösterir."
source = "https://github.com/tldr-pages/tldr"
license = "MIT"
executable = "tldr"
install_method = "apt"
install_command = ["sudo", "apt", "install", "-y", "tldr"]
supported_platforms = ["linux-x64"]
install_notes = """npm: npm install -g tldr\npipx: pipx install tldr\nbrew: brew install tldr\napt: sudo apt install tldr\npacman: sudo pacman -S tldr\nResmî: https://github.com/tldr-pages/tldr#install"""

