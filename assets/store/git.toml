# Nova mağaza kataloğu — Git
#
# Kategori: "Git"
# `assets/store/` altında; loader tüm kategori dosyalarını birleştirir.
# Kullanıcı düzenlemez. Kaynak: Nova-Store sync (`tools/sync_store_catalog.sh`).
# download_archive için https + SHA-256 zorunlu.
# İsteğe bağlı: artifacts, release, repository_url, signature.

[[apps]]
id = "delta"
name = "delta"
category = "Git"
description = """
Git diff'lerini renkli ve okunaklı gösterir; genellikle git yapılandırmasına bağlanır.

"""
source = "https://github.com/dandavison/delta"
license = "MIT"
executable = "delta"
install_method = "apt"
supported_platforms = ["linux-x64", "linux-aarch64"]
install_command = ["sudo", "apt", "install", "-y", "git-delta"]
install_notes = """
brew: brew install git-delta
cargo: cargo install git-delta
apt: sudo apt install git-delta
pacman: sudo pacman -S git-delta
Resmî: https://github.com/dandavison/delta#installation

"""

