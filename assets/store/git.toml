# Nova mağaza kataloğu — git
#
# Kategori: "Git"
# `assets/store/` altında; loader tüm kategori dosyalarını birleştirir.
# Kullanıcı düzenlemez. download_archive için https + SHA-256 zorunlu.

[[apps]]
id = "lazygit"
name = "lazygit"
category = "Git"
description = "Git işlemleri için klavye odaklı terminal arayüzü."
source = "https://github.com/jesseduffield/lazygit"
license = "MIT"
executable = "lazygit"
install_method = "download_archive"
supported_platforms = ["linux-x64"]
version = "0.66.2"
download_url = "https://github.com/jesseduffield/lazygit/releases/download/v0.66.2/lazygit_0.66.2_linux_x86_64.tar.gz"
checksum = "158efc9ddfa1241fab5fb3526bb442c8dc6c4b1904d73213b9e4e93e03c52034"
checksum_type = "sha256"

[apps.release]
repo = "jesseduffield/lazygit"
tag_prefix = "v"
asset_pattern = "lazygit_{version}_linux_x86_64.tar.gz"
checksum_asset_pattern = "checksums.txt"

[[apps]]
id = "gitui"
name = "gitui"
category = "Git"
description = "Rust ile yazılmış hızlı Git terminal arayüzü."
source = "https://github.com/extrawurst/gitui"
license = "MIT"
executable = "gitui"
install_method = "apt"
install_command = ["sudo", "apt", "install", "-y", "gitui"]
supported_platforms = ["linux-x64"]
install_notes = """cargo: cargo install gitui\nbrew: brew install gitui\napt: sudo apt install gitui\npacman: sudo pacman -S gitui\nResmî: https://github.com/extrawurst/gitui#installation"""

