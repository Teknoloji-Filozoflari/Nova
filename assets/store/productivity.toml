# Nova mağaza kataloğu — Verimlilik
#
# Kategori: "Verimlilik"
# `assets/store/` altında; loader tüm kategori dosyalarını birleştirir.
# Kullanıcı düzenlemez. Kaynak: Nova-Store sync (`tools/sync_store_catalog.sh`).
# download_archive için https + SHA-256 zorunlu.
# İsteğe bağlı: artifacts, release, repository_url, signature.

[[apps]]
id = "atuin"
name = "Atuin"
category = "Verimlilik"
description = "Senkronize, aranabilir kabuk geçmişi."
source = "https://atuin.sh/"
license = "MIT"
executable = "atuin"
install_method = "brew"
supported_platforms = ["linux-x64", "linux-aarch64"]
install_command = ["brew", "install", "atuin"]
install_notes = """
curl: curl --proto '=https' --tlsv1.2 -LsSf https://setup.atuin.sh | sh
brew: brew install atuin
Resmî: https://docs.atuin.sh/guide/installation/

"""

