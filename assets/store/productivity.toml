# Nova mağaza kataloğu — productivity
#
# Kategori: "Verimlilik"
# `assets/store/` altında; loader tüm kategori dosyalarını birleştirir.
# Kullanıcı düzenlemez. download_archive için https + SHA-256 zorunlu.

[[apps]]
id = "tmux"
name = "tmux"
category = "Verimlilik"
description = "Terminal çoğullayıcı; oturum, pencere ve panel yönetimi."
source = "https://github.com/tmux/tmux"
license = "ISC"
executable = "tmux"
install_method = "apt"
install_command = ["sudo", "apt", "install", "-y", "tmux"]
supported_platforms = ["linux-x64"]
install_notes = """apt: sudo apt install tmux\nbrew: brew install tmux\npacman: sudo pacman -S tmux\nResmî: https://github.com/tmux/tmux/wiki/Installing"""

