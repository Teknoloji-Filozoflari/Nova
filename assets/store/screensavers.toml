# Nova mağaza kataloğu — Ekran Koruyucular
#
# Kategori: "Ekran Koruyucular"
# `assets/store/` altında; loader tüm kategori dosyalarını birleştirir.
# Kullanıcı düzenlemez. Kaynak: Nova-Store sync (`tools/sync_store_catalog.sh`).
# download_archive için https + SHA-256 zorunlu.
# İsteğe bağlı: artifacts, release, repository_url, signature.

[[apps]]
id = "asciimatics-demo"
name = "asciimatics"
category = "Ekran Koruyucular"
description = "ASCII animasyon kütüphanesi demo."
source = "https://github.com/peterbrittain/asciimatics"
license = "Apache-2.0"
executable = "asciimatics"
install_method = "pipx"
supported_platforms = ["linux-x64", "linux-aarch64"]
install_command = ["pipx", "install", "asciimatics"]
install_notes = """
pipx: pipx install asciimatics
pip: pip install asciimatics
Resmî: https://github.com/peterbrittain/asciimatics

"""

