# Nova mağaza kataloğu — screensavers
#
# Kategori: "Ekran Koruyucular"
# `assets/store/` altında; loader tüm kategori dosyalarını birleştirir.
# Kullanıcı düzenlemez. download_archive için https + SHA-256 zorunlu.
# Desteklenen platformlar: linux-x64, linux-aarch64.
# İsteğe bağlı: artifacts (mimari URL), signature (minisign/cosign/gpg).

[[apps]]
id = "pipes-sh"
name = "pipes.sh"
category = "Ekran Koruyucular"
description = "Rastgele boru ekran koruyucusu."
source = "https://github.com/pipeseroni/pipes.sh"
license = "MIT"
executable = "pipes.sh"
install_method = "pacman"
install_command = ["sudo", "pacman", "-S", "--noconfirm", "pipes.sh"]
supported_platforms = ["linux-x64", "linux-aarch64"]
install_notes = "pacman: sudo pacman -S pipes.sh\nbrew: brew install pipes-sh\nResmî: https://github.com/pipeseroni/pipes.sh"

