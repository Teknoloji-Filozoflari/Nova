# Nova mağaza kataloğu — Güvenlik
#
# Kategori: "Güvenlik"
# `assets/store/` altında; loader tüm kategori dosyalarını birleştirir.
# Kullanıcı düzenlemez. Kaynak: Nova-Store sync (`tools/sync_store_catalog.sh`).
# download_archive için https + SHA-256 zorunlu.
# İsteğe bağlı: artifacts, release, repository_url, signature.

[[apps]]
id = "age"
name = "age"
category = "Güvenlik"
description = "Basit, modern ve güvenli dosya şifreleme aracı."
source = "https://github.com/FiloSottile/age"
license = "BSD-3-Clause"
executable = "age"
install_method = "apt"
supported_platforms = ["linux-x64", "linux-aarch64"]
install_command = ["sudo", "apt", "install", "-y", "age"]
install_notes = """
apt: sudo apt install age
brew: brew install age
go: go install filippo.io/age/cmd/...@latest
pacman: sudo pacman -S age
Resmî: https://github.com/FiloSottile/age#installation

"""

