# Nova mağaza kataloğu — security
#
# Kategori: "Güvenlik"
# `assets/store/` altında; loader tüm kategori dosyalarını birleştirir.
# Kullanıcı düzenlemez. download_archive için https + SHA-256 zorunlu.

[[apps]]
id = "age"
name = "age"
category = "Güvenlik"
description = "Basit, modern ve güvenli dosya şifreleme aracı."
source = "https://github.com/FiloSottile/age"
license = "BSD-3-Clause"
executable = "age"
install_method = "apt"
install_command = ["sudo", "apt", "install", "-y", "age"]
supported_platforms = ["linux-x64"]
install_notes = """apt: sudo apt install age\nbrew: brew install age\ngo: go install filippo.io/age/cmd/...@latest\npacman: sudo pacman -S age\nResmî: https://github.com/FiloSottile/age#installation"""

