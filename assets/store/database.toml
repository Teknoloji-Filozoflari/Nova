# Nova mağaza kataloğu — Veritabanı
#
# Kategori: "Veritabanı"
# `assets/store/` altında; loader tüm kategori dosyalarını birleştirir.
# Kullanıcı düzenlemez. Kaynak: Nova-Store sync (`tools/sync_store_catalog.sh`).
# download_archive için https + SHA-256 zorunlu.
# İsteğe bağlı: artifacts, release, repository_url, signature.

[[apps]]
id = "chdig"
name = "chdig"
category = "Veritabanı"
description = "ClickHouse için TUI keşif aracı."
source = "https://github.com/azat/chdig"
license = "MIT"
executable = "chdig"
install_method = "brew"
supported_platforms = ["linux-x64", "linux-aarch64"]
install_command = ["brew", "install", "chdig"]
install_notes = """
brew: brew install chdig
Resmî: https://github.com/azat/chdig

"""

[apps.release]
repo = "azat/chdig"

