[[apps]]
id = "pg-activity"
name = "pg_activity"
category = "Veritabanı"
description = "PostgreSQL sunucu etkinliğini izleyen etkileşimli terminal aracı (Dalibo). Çalışan, bekleyen ve bloke eden sorguları canlı listeler; CPU/bellek/IO, TPS, kilitler ve geçici dosya boyutunu gösterir. Sorguları iptal veya sonlandırabilir; CSV çıktısı, profiller (narrow/wide/minimal) ve AWS RDS seçenekleri vardır. Yerel veya uzak bağlantı; tam sistem bilgisi için postgres kullanıcısı önerilir."
source = "https://github.com/dalibo/pg_activity"
license = "PostgreSQL"
executable = "pg_activity"
install_method = "pipx"
supported_platforms = ["linux-x64", "linux-aarch64"]
install_command = ["pipx", "install", "pg_activity[psycopg]"]
install_notes = """
pipx: pipx install "pg_activity[psycopg]"
apt: sudo apt install pg-activity
psycopg extra'sı PostgreSQL sürücüsünü birlikte kurar; ek olarak PostgreSQL sunucusu çalışıyor olmalıdır.
Sistem bilgisi için postgres kullanıcısıyla çalıştırın: sudo -u postgres pg_activity -U postgres
Resmî: https://github.com/dalibo/pg_activity

"""

