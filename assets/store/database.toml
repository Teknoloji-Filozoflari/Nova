# Nova mağaza kataloğu — database
#
# Kategori: "Veritabanı"
# `assets/store/` altında; loader tüm kategori dosyalarını birleştirir.
# Kullanıcı düzenlemez. download_archive için https + SHA-256 zorunlu.
# Desteklenen platformlar: linux-x64, linux-aarch64.
# İsteğe bağlı: artifacts (mimari URL), signature (minisign/cosign/gpg).

[[apps]]
id = "lazysql"
name = "lazysql"
category = "Veritabanı"
description = "Veritabanlarını gezmek için terminal arayüzü."
source = "https://github.com/jorgerojas26/lazysql"
license = "MIT"
executable = "lazysql"
install_method = "manual"
supported_platforms = ["linux-x64", "linux-aarch64"]
install_notes = """go: go install github.com/jorgerojas26/lazysql@latest\nResmî: https://github.com/jorgerojas26/lazysql#installation"""

[[apps]]
id = "harlequin"
name = "Harlequin"
category = "Veritabanı"
description = "Terminal için SQL IDE."
source = "https://github.com/tconbeer/harlequin"
license = "MIT"
executable = "harlequin"
install_method = "pipx"
install_command = ["pipx", "install", "harlequin"]
supported_platforms = ["linux-x64", "linux-aarch64"]
install_notes = """pipx: pipx install harlequin\nuv: uv tool install harlequin\nResmî: https://harlequin.sh/"""

