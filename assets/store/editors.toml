# Nova mağaza kataloğu — editors
#
# Kategori: "Editörler"
# `assets/store/` altında; loader tüm kategori dosyalarını birleştirir.
# Kullanıcı düzenlemez. download_archive için https + SHA-256 zorunlu.
# Desteklenen platformlar: linux-x64, linux-aarch64.
# İsteğe bağlı: artifacts (mimari URL), signature (minisign/cosign/gpg).

[[apps]]
id = "neovim"
name = "Neovim"
category = "Editörler"
description = "Vim'in genişletilebilir modern çatalı."
source = "https://neovim.io/"
license = "Apache-2.0"
executable = "nvim"
install_method = "apt"
install_command = ["sudo", "apt", "install", "-y", "neovim"]
supported_platforms = ["linux-x64", "linux-aarch64"]
install_notes = """apt: sudo apt install neovim\nbrew: brew install neovim\npacman: sudo pacman -S neovim\nResmî: https://github.com/neovim/neovim/blob/master/INSTALL.md"""

[[apps]]
id = "helix"
name = "Helix"
category = "Editörler"
description = "Modal, seçim-öncelikli modern terminal editörü."
