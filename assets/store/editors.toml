# Nova mağaza kataloğu — Editörler
#
# Kategori: "Editörler"
# `assets/store/` altında; loader tüm kategori dosyalarını birleştirir.
# Kullanıcı düzenlemez. Kaynak: Nova-Store sync (`tools/sync_store_catalog.sh`).
# download_archive için https + SHA-256 zorunlu.
# İsteğe bağlı: artifacts, release, repository_url, signature.

[[apps]]
id = "amp-editor"
name = "amp"
category = "Editörler"
description = "Tam özellikli terminal metin editörü."
source = "https://github.com/jmacdonald/amp"
license = "GPL-3.0"
executable = "amp"
install_method = "cargo"
supported_platforms = ["linux-x64", "linux-aarch64"]
install_command = ["cargo", "install", "amp"]
install_notes = """
cargo: cargo install amp
brew: brew install amp
Resmî: https://github.com/jmacdonald/amp

"""

[[apps]]
id = "dhex"
name = "dhex"
category = "Editörler"
description = "Ncurses hex editörü."
source = "https://www.dettus.net/dhex/"
license = "GPL-2.0"
executable = "dhex"
install_method = "pacman"
supported_platforms = ["linux-x64", "linux-aarch64"]
install_command = ["sudo", "pacman", "-S", "--noconfirm", "dhex"]
install_notes = """
pacman: sudo pacman -S dhex
apt: sudo apt install dhex
Resmî: https://www.dettus.net/dhex/

"""

[[apps]]
