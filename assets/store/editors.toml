license = "MPL-2.0"
executable = "hx"
install_method = "cargo"
install_command = ["cargo", "install", "--locked", "helix-term"]
supported_platforms = ["linux-x64", "linux-aarch64"]
install_notes = """brew: brew install helix\ncargo: cargo install --locked helix-term\nResmî: https://docs.helix-editor.com/install.html"""

