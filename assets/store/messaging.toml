# Nova mağaza kataloğu — messaging
#
# Kategori: "Mesajlaşma"
# `assets/store/` altında; loader tüm kategori dosyalarını birleştirir.
# Kullanıcı düzenlemez. download_archive için https + SHA-256 zorunlu.
# Desteklenen platformlar: linux-x64, linux-aarch64.
# İsteğe bağlı: artifacts (mimari URL), signature (minisign/cosign/gpg).

[[apps]]
id = "aerc"
name = "aerc"
category = "Mesajlaşma"
description = "E-posta için zarif terminal istemcisi."
source = "https://aerc-mail.org/"
license = "MIT"
executable = "aerc"
install_method = "apt"
install_command = ["sudo", "apt", "install", "-y", "aerc"]
supported_platforms = ["linux-x64", "linux-aarch64"]
install_notes = """apt: sudo apt install aerc\nbrew: brew install aerc\npacman: sudo pacman -S aerc\nResmî: https://aerc-mail.org/"""

