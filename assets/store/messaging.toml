# Nova mağaza kataloğu — Mesajlaşma
#
# Kategori: "Mesajlaşma"
# `assets/store/` altında; loader tüm kategori dosyalarını birleştirir.
# Kullanıcı düzenlemez. Kaynak: Nova-Store sync (`tools/sync_store_catalog.sh`).
# download_archive için https + SHA-256 zorunlu.
# İsteğe bağlı: artifacts, release, repository_url, signature.

[[apps]]
id = "aerc"
name = "aerc"
category = "Mesajlaşma"
description = "E-posta için zarif terminal istemcisi."
source = "https://aerc-mail.org/"
license = "MIT"
executable = "aerc"
install_method = "apt"
supported_platforms = ["linux-x64", "linux-aarch64"]
install_command = ["sudo", "apt", "install", "-y", "aerc"]
install_notes = """
apt: sudo apt install aerc
brew: brew install aerc
pacman: sudo pacman -S aerc
Resmî: https://aerc-mail.org/

"""

