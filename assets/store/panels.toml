# Nova mağaza kataloğu — Paneller
#
# Kategori: "Paneller"
# `assets/store/` altında; loader tüm kategori dosyalarını birleştirir.
# Kullanıcı düzenlemez. Kaynak: Nova-Store sync (`tools/sync_store_catalog.sh`).
# download_archive için https + SHA-256 zorunlu.
# İsteğe bağlı: artifacts, release, repository_url, signature.

[[apps]]
id = "atop"
name = "atop"
category = "Paneller"
description = "Gelişmiş sistem/process izleyici."
source = "https://www.atoptool.nl/"
license = "GPL-2.0"
executable = "atop"
install_method = "pacman"
supported_platforms = ["linux-x64", "linux-aarch64"]
install_command = ["sudo", "pacman", "-S", "--noconfirm", "atop"]
install_notes = """
pacman: sudo pacman -S atop
apt: sudo apt install atop
Resmî: https://www.atoptool.nl/

"""

