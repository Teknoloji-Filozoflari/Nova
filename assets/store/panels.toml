# Nova mağaza kataloğu — panels
#
# Kategori: "Paneller"
# `assets/store/` altında; loader tüm kategori dosyalarını birleştirir.
# Kullanıcı düzenlemez. download_archive için https + SHA-256 zorunlu.

[[apps]]
id = "gotop"
name = "gotop"
category = "Paneller"
description = "Grafiksel sistem izleyici."
source = "https://github.com/xxxserxxx/gotop"
license = "MIT"
executable = "gotop"
install_method = "pacman"
install_command = ["sudo", "pacman", "-S", "--noconfirm", "gotop"]
supported_platforms = ["linux-x64"]
install_notes = "pacman: sudo pacman -S gotop\nResmî: https://github.com/xxxserxxx/gotop"

