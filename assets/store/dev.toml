# Nova mağaza kataloğu — Geliştirme
#
# Kategori: "Geliştirme"
# `assets/store/` altında; loader tüm kategori dosyalarını birleştirir.
# Kullanıcı düzenlemez. Kaynak: Nova-Store sync (`tools/sync_store_catalog.sh`).
# download_archive için https + SHA-256 zorunlu.
# İsteğe bağlı: artifacts, release, repository_url, signature.

[[apps]]
id = "act"
name = "act"
category = "Geliştirme"
description = "GitHub Actions iş akışlarını yerelde çalıştırır."
source = "https://github.com/nektos/act"
license = "MIT"
executable = "act"
install_method = "brew"
supported_platforms = ["linux-x64", "linux-aarch64"]
install_command = ["brew", "install", "act"]
install_notes = """
brew: brew install act
Resmî: https://nektosact.com/installation/

"""

