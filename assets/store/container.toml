# Nova mağaza kataloğu — Konteyner
#
# Kategori: "Konteyner"
# `assets/store/` altında; loader tüm kategori dosyalarını birleştirir.
# Kullanıcı düzenlemez. Kaynak: Nova-Store sync (`tools/sync_store_catalog.sh`).
# download_archive için https + SHA-256 zorunlu.
# İsteğe bağlı: artifacts, release, repository_url, signature.

[[apps]]
id = "buildah"
name = "buildah"
category = "Konteyner"
description = "OCI imaj oluşturma aracı."
source = "https://buildah.io/"
license = "Apache-2.0"
executable = "buildah"
install_method = "pacman"
supported_platforms = ["linux-x64", "linux-aarch64"]
install_command = ["sudo", "pacman", "-S", "--noconfirm", "buildah"]
install_notes = """
pacman: sudo pacman -S buildah
apt: sudo apt install buildah
Resmî: https://buildah.io/

"""

