# Nova mağaza kataloğu — ai
#
# Kategori: "AI"
# `assets/store/` altında; loader tüm kategori dosyalarını birleştirir.
# Kullanıcı düzenlemez. download_archive için https + SHA-256 zorunlu.

[[apps]]
id = "aider"
name = "Aider"
category = "AI"
description = "Terminalde LLM ile çift programlama; Claude ve GPT ile kod düzenler."
source = "https://aider.chat"
license = "Apache-2.0"
executable = "aider"
install_method = "pipx"
install_command = ["pipx", "install", "aider-chat"]
supported_platforms = ["linux-x64"]
install_notes = """pipx: pipx install aider-chat\npip: python3 -m pip install aider-chat\nResmî: https://aider.chat/"""

