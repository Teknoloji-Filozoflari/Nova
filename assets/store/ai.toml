# Nova mağaza kataloğu — AI
#
# Kategori: "AI"
# `assets/store/` altında; loader tüm kategori dosyalarını birleştirir.
# Kullanıcı düzenlemez. Kaynak: Nova-Store sync (`tools/sync_store_catalog.sh`).
# download_archive için https + SHA-256 zorunlu.
# İsteğe bağlı: artifacts, release, repository_url, signature.

[[apps]]
id = "aichat"
name = "aichat"
category = "AI"
description = "Çok modellı AI CLI sohbet aracı."
source = "https://github.com/sigoden/aichat"
license = "Apache-2.0"
executable = "aichat"
install_method = "cargo"
supported_platforms = ["linux-x64", "linux-aarch64"]
install_command = ["cargo", "install", "aichat"]
install_notes = """
cargo: cargo install aichat
brew: brew install aichat
pacman: AUR aichat
Resmî: https://github.com/sigoden/aichat

"""

