# Nova mağaza kataloğu — Web
#
# Kategori: "Web"
# `assets/store/` altında; loader tüm kategori dosyalarını birleştirir.
# Kullanıcı düzenlemez. Kaynak: Nova-Store sync (`tools/sync_store_catalog.sh`).
# download_archive için https + SHA-256 zorunlu.
# İsteğe bağlı: artifacts, release, repository_url, signature.

[[apps]]
id = "browsh"
name = "browsh"
category = "Web"
description = "Modern web'i terminalde gösteren tarayıcı."
source = "https://www.brow.sh/"
license = "LGPL-2.1"
executable = "browsh"
install_method = "brew"
supported_platforms = ["linux-x64", "linux-aarch64"]
install_command = ["brew", "install", "browsh"]
install_notes = """
brew: brew install browsh
Resmî: https://www.brow.sh/

"""

[[apps]]
id = "buku"
name = "buku"
