# Nova mağaza kataloğu — web
#
# Kategori: "Web"
# `assets/store/` altında; loader tüm kategori dosyalarını birleştirir.
# Kullanıcı düzenlemez. download_archive için https + SHA-256 zorunlu.

[[apps]]
id = "w3m"
name = "w3m"
category = "Web"
description = "Metin tabanlı web tarayıcı."
source = "https://github.com/tats/w3m"
license = "w3m"
executable = "w3m"
install_method = "apt"
install_command = ["sudo", "apt", "install", "-y", "w3m"]
supported_platforms = ["linux-x64"]
install_notes = """apt: sudo apt install w3m\nbrew: brew install w3m\npacman: sudo pacman -S w3m\nResmî: https://w3m.sourceforge.net/"""

