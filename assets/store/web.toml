executable = "buku"
install_method = "pacman"
supported_platforms = ["linux-x64", "linux-aarch64"]
install_command = ["sudo", "pacman", "-S", "--noconfirm", "buku"]
install_notes = """
pacman: sudo pacman -S buku
pipx: pipx install buku
Resmî: https://github.com/jarun/buku

"""

