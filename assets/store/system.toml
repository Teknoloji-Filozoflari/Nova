[[apps]]
id = "systemctl-tui"
name = "systemctl-tui"
category = "Sistem"
description = "systemctl-tui, systemd birimlerini ve günlüklerini yönetmek için hızlı ve sade bir TUI’dir: servis/zamanlayıcı durumu ve logları gezme, başlat/durdur, birim dosyası görüntüleme/düzenleme. --host user@host ile SSH üzerinden uzaktan yönetim (uzakta ek kurulum gerekmez). Nova servis yöneticisi değildir; systemctl-tui Lazygit tarzı bir systemd yüzeyidir."
source = "https://github.com/rgwood/systemctl-tui"
license = "MIT"
executable = "systemctl-tui"
install_method = "pacman"
supported_platforms = ["linux-x64", "linux-aarch64"]
install_command = ["sudo", "pacman", "-S", "--noconfirm", "systemctl-tui"]
install_notes = """
pacman: sudo pacman -S systemctl-tui
cargo: cargo install systemctl-tui
GitHub yayınları x64 ve ARM64 ikilileri sunar.
Yalnızca systemd üzerinde çalışır; WSL kullanıcıları systemd etkin olmalıdır.
Servis/zamanlayıcı başlatma, durdurma ve enable/disable işlemleri için sudo yetkisi gerekir.
Uzak sunucu yönetimi: systemctl-tui --host user@hostname (SSH üzerinden, uzak tarafta kurulum gerekmez).
Resmî: https://github.com/rgwood/systemctl-tui

"""

