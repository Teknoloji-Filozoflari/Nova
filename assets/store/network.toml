# Nova mağaza kataloğu — network
#
# Kategori: "Ağ"
# `assets/store/` altında; loader tüm kategori dosyalarını birleştirir.
# Kullanıcı düzenlemez. download_archive için https + SHA-256 zorunlu.

[[apps]]
id = "bandwhich"
name = "bandwhich"
category = "Ağ"
description = "Ağ bant genişliğini süreç ve bağlantı bazında gösterir. Yerel arayüzleri izlemek için ek izinler gerekebilir."
source = "https://github.com/imsnif/bandwhich"
license = "MIT"
executable = "bandwhich"
install_method = "cargo"
install_command = ["cargo", "install", "bandwhich"]
supported_platforms = ["linux-x64"]
install_notes = """cargo: cargo install bandwhich\nbrew: brew install bandwhich\nResmî: https://github.com/imsnif/bandwhich#installation"""

