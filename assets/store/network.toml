[[apps]]
id = "wireguard-tools"
name = "WireGuard tools"
category = "Ağ"
description = "wireguard-tools, modern VPN tüneli WireGuard için kullanıcı alanı araçlarını sağlar: wg ile anahtar üretimi ve arayüz yapılandırması, wg-quick ile hızlı up/down. Kernel veya wireguard-go üzerinden çalışır; SSH benzeri genel anahtar değişimiyle kurulur, IPsec/OpenVPN’e göre daha sade ve performanslıdır. Nova ağ tüneli kurmaz; bu paket WireGuard arayüzlerini yönetir (root/CAP_NET_ADMIN)."
source = "https://www.wireguard.com/"
license = "GPL-2.0-only"
executable = "wg"
install_method = "pacman"
supported_platforms = ["linux-x64", "linux-aarch64"]
install_command = ["sudo", "pacman", "-S", "--noconfirm", "wireguard-tools"]
install_notes = """
pacman: sudo pacman -S wireguard-tools
apt: sudo apt install wireguard-tools
dnf: sudo dnf install wireguard-tools
Komutlar: wg (tünel yapılandırma ve anahtar üretimi) ve wg-quick (bash tabanlı hızlı kurulum).
Sistem izinleri: wg-quick arayüz oluşturma ve yönlendirme için root (CAP_NET_ADMIN) gerektirir; up/down komutları sudo ile çalıştırılmalıdır.
wireguard çekirdek modülü gerekir; yoksa wireguard-go kullanıcı alanı uygulamasına düşer.
Resmî: https://www.wireguard.com/

"""

