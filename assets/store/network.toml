executable = "curl"
install_method = "apt"
install_command = ["sudo", "apt", "install", "-y", "curl"]
supported_platforms = ["linux-x64"]
install_notes = """apt: sudo apt install curl\nbrew: brew install curl\npacman: sudo pacman -S curl\nResmî: https://curl.se/docs/install.html"""

