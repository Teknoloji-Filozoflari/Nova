# Nova mağaza kataloğu — Dosya ve Arama
#
# Kategori: "Dosya ve Arama"
# `assets/store/` altında; loader tüm kategori dosyalarını birleştirir.
# Kullanıcı düzenlemez. Kaynak: Nova-Store sync (`tools/sync_store_catalog.sh`).
# download_archive için https + SHA-256 zorunlu.
# İsteğe bağlı: artifacts, release, repository_url, signature.

[[apps]]
id = "bat"
name = "bat"
category = "Dosya ve Arama"
description = "Sözdizimi renklendirmeli dosya görüntüleyici."
source = "https://github.com/sharkdp/bat"
license = "MIT OR Apache-2.0"
executable = "bat"
install_method = "apt"
supported_platforms = ["linux-x64", "linux-aarch64"]
install_command = ["sudo", "apt", "install", "-y", "bat"]
install_notes = """
brew: brew install bat
apt: sudo apt install bat  # ikili adı bazen batcat
cargo: cargo install bat
pacman: sudo pacman -S bat
Resmî: https://github.com/sharkdp/bat#installation

"""

