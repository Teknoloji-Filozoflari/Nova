checksum_type = "sha256"
asset_pattern = "fzf-{version}-linux_arm64.tar.gz"
checksum_asset_pattern = "fzf_{version}_checksums.txt"

[apps.release]
repo = "junegunn/fzf"
tag_prefix = "v"
asset_pattern = "fzf-{version}-linux_amd64.tar.gz"
checksum_asset_pattern = "fzf_{version}_checksums.txt"

