# Nova mağaza kataloğu — games
#
# Kategori: "Oyunlar"
# `assets/store/` altında; loader tüm kategori dosyalarını birleştirir.
# Kullanıcı düzenlemez. download_archive için https + SHA-256 zorunlu.
# Desteklenen platformlar: linux-x64, linux-aarch64.
# İsteğe bağlı: artifacts (mimari URL), signature (minisign/cosign/gpg).

[[apps]]
id = "nethack"
name = "NetHack"
category = "Oyunlar"
description = "Klasik roguelike zindan oyunu."
source = "https://www.nethack.org/"
license = "NGPL"
executable = "nethack"
install_method = "apt"
install_command = ["sudo", "apt", "install", "-y", "nethack-console"]
supported_platforms = ["linux-x64", "linux-aarch64"]
install_notes = """apt: sudo apt install nethack-console\nbrew: brew install nethack\npacman: sudo pacman -S nethack\nResmî: https://www.nethack.org/"""

