# Nova mağaza kataloğu — Oyunlar
#
# Kategori: "Oyunlar"
# `assets/store/` altında; loader tüm kategori dosyalarını birleştirir.
# Kullanıcı düzenlemez. Kaynak: Nova-Store sync (`tools/sync_store_catalog.sh`).
# download_archive için https + SHA-256 zorunlu.
# İsteğe bağlı: artifacts, release, repository_url, signature.

[[apps]]
id = "2048-cli"
name = "2048"
category = "Oyunlar"
description = "2048 terminal oyunu."
source = "https://github.com/tiehuis/2048-cli"
license = "MIT"
executable = "2048"
install_method = "pacman"
supported_platforms = ["linux-x64", "linux-aarch64"]
install_command = ["sudo", "pacman", "-S", "--noconfirm", "2048-cli"]
install_notes = """
pacman: sudo pacman -S 2048-cli / AUR
manual: https://github.com/tiehuis/2048-cli

"""

