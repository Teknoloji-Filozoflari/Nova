# Nova mağaza kataloğu — media
#
# Kategori: "Medya"
# `assets/store/` altında; loader tüm kategori dosyalarını birleştirir.
# Kullanıcı düzenlemez. download_archive için https + SHA-256 zorunlu.
# Desteklenen platformlar: linux-x64, linux-aarch64.
# İsteğe bağlı: artifacts (mimari URL), signature (minisign/cosign/gpg).

[[apps]]
id = "ncspot"
name = "ncspot"
category = "Medya"
description = "Spotify için ncurses istemcisi."
source = "https://github.com/hrkfdn/ncspot"
license = "BSD-2-Clause"
executable = "ncspot"
install_method = "cargo"
install_command = ["cargo", "install", "ncspot"]
supported_platforms = ["linux-x64", "linux-aarch64"]
install_notes = """cargo: cargo install ncspot\nbrew: brew install ncspot\nResmî: https://github.com/hrkfdn/ncspot#installation"""

