# Nova mağaza kataloğu — Medya
#
# Kategori: "Medya"
# `assets/store/` altında; loader tüm kategori dosyalarını birleştirir.
# Kullanıcı düzenlemez. Kaynak: Nova-Store sync (`tools/sync_store_catalog.sh`).
# download_archive için https + SHA-256 zorunlu.
# İsteğe bağlı: artifacts, release, repository_url, signature.

[[apps]]
id = "catimg"
name = "catimg"
category = "Medya"
description = "Görselleri 256 renkli terminalde yazdırır."
source = "https://github.com/posva/catimg"
license = "MIT"
executable = "catimg"
install_method = "pacman"
supported_platforms = ["linux-x64", "linux-aarch64"]
install_command = ["sudo", "pacman", "-S", "--noconfirm", "catimg"]
install_notes = """
pacman: sudo pacman -S catimg
Resmî: https://github.com/posva/catimg

"""

