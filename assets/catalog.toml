info_text = """
delta tek başına çalıştırıldığında bir diff bekler; bu bir kabuk/git
entegrasyonudur.

.gitconfig dosyasına ekleyin:

  [core]
      pager = delta
  [interactive]
      diffFilter = delta --color-only

Olmadan Nova'dan başlatmak anlamlı bir çıktı üretmez.
"""
