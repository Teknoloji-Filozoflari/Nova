# Nova varsayılan araç kataloğu.
#
# Bu dosya uygulamayla birlikte gelir ve derleme sırasında ikiliye gömülür;
# kullanıcı bunu düzenlemez. Güncellemeler bu dosyayı değiştirebilir.
#
# Kendi araçlarını eklemek, bir aracın alanlarını değiştirmek veya favorileri
# korumak için `~/.config/nova/config.toml` kullanılır. Nova iki dosyayı
# `id` alanına göre birleştirir: aynı `id` hem burada hem kullanıcı dosyasında
# varsa kullanıcının verdiği alanlar kazanır, diğer alanlar buradan gelir.
#
# Alanlar:
#   id                Zorunlu, benzersiz kimlik (birleştirme anahtarı).
#   name              Ekranda görünen ad. Boşsa `id` kullanılır.
#   category          CATEGORIES listesinden biri (aşağıda).
#   executable        PATH üzerinde aranacak program adı. Boşsa `id`.
#   args              Argümanlar ayrı ayrı verilir; kabuk yok, genişletme yok.
#   launch_kind       interactive | command_help | shell_integration_info |
#                     custom_command
#   help_text         `command_help` için gösterilecek sabit metin. Araç
#                     `--help` ile ÇALIŞTIRILMAZ.
#   handlers          `help_text` tek sayfaya sığmazsa kullanılacak
#                     sayfalayıcılar; PATH'te bulunan ilki kullanılır.
#   info_text         `shell_integration_info` için açıklama.
#   alternative_to    Bu araç başka bir araca alternatifse o aracın `id`si.
#   working_directory current | home | custom | project
#   working_dir_path  `custom`/`project` için yol.
#   favorite          Başlangıçta favori mi.
#
# Kategoriler:
#   AI ve Kodlama
#   Git ve Geliştirici Araçları
#   Dosya Yönetimi ve Arama
#   Sistem ve Kaynak Kullanımı
#   Ağ ve Bağlantı
#   Docker ve Sunucu
#   Günlük Terminal Yardımcıları
#   Özel Araçlar

