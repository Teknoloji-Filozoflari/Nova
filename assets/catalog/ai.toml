# Nova araç kataloğu — ai
#
# Kategori: "AI ve Kodlama"
# `assets/catalog/` altında; loader tüm kategori dosyalarını birleştirir.
# Kullanıcı düzenlemez; özelleştirme: ~/.config/nova/config.toml
#
# `actions`: AI aracı seçilince detay yanında her zaman görünen eylemler.
# Boş args = birincil açma (Enter listede de bunu yapar).

[[tools]]
id = "opencode"
name = "OpenCode"
category = "AI ve Kodlama"
executable = "opencode"
description = "Terminalde çalışan açık kaynaklı yapay zekâ kodlama asistanı."
examples = ["opencode   ← etkileşimli AI oturumu", "opencode --help", "opencode -c   ← önceki oturuma devam"]
setup_info = "Kullanmak için terminalde 'opencode' yazın; ilk çalıştırmada kimlik doğrulama istenir."
actions = [
  { id = "open", label = "Aç", args = [] },
  { id = "resume", label = "Devam et", args = ["-c"] },
  { id = "logout", label = "Çıkış yap", args = ["auth", "logout"] },
  { id = "help", label = "Yardım", args = ["--help"] },
]

[[tools]]
id = "codex"
name = "OpenAI Codex CLI"
category = "AI ve Kodlama"
executable = "codex"
description = "OpenAI'nin terminal tabanlı kodlama ajanı."
