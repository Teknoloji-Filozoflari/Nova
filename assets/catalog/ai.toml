setup_info = "Kullanmak için terminalde 'codex' yazın; ilk çalıştırmada kimlik doğrulama istenir."
actions = [
  { id = "open", label = "Aç", args = [] },
  { id = "resume", label = "Devam et", args = ["resume"] },
  { id = "logout", label = "Çıkış yap", args = ["logout"] },
  { id = "help", label = "Yardım", args = ["--help"] },
]

