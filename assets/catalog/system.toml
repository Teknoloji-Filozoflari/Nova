# Nova araç kataloğu — system
#
# Kategori: "Sistem ve Kaynak Kullanımı"
# `assets/catalog/` altında; loader tüm kategori dosyalarını birleştirir.
# Kullanıcı düzenlemez; özelleştirme: ~/.config/nova/config.toml

[[tools]]
id = "btop"
name = "btop"
category = "Sistem ve Kaynak Kullanımı"
executable = "btop"
description = "CPU, bellek, disk ve ağ kullanımını grafik olarak izler."
