# Nova araç kataloğu — system
#
# Kategori: "Sistem ve Kaynak Kullanımı"
# `assets/catalog/` altında; loader tüm kategori dosyalarını birleştirir.
# Kullanıcı düzenlemez; özelleştirme: ~/.config/nova/config.toml

[[tools]]
id = "btop"
name = "btop"
category = "Sistem ve Kaynak Kullanımı"
executable = "btop"
description = "CPU, bellek, disk ve ağ kullanımını grafik olarak izler."
examples = ["btop   ← canlı CPU/bellek/disk/ağ grafikleri", "btop --help   ← seçenekler", "İpucu: çoğu izleyicide çıkmak için q"]

[[tools]]
id = "fastfetch"
name = "fastfetch"
category = "Sistem ve Kaynak Kullanımı"
executable = "fastfetch"
description = "Sistem bilgilerini logoyla birlikte hızlıca özetler."
examples = ["fastfetch   ← logo + sistem özeti", "fastfetch --logo none   ← logosuz özet", "fastfetch --help"]

[[tools]]
id = "procs"
name = "procs"
category = "Sistem ve Kaynak Kullanımı"
executable = "procs"
description = "Renkli ve okunaklı süreç listesi; `ps`ye modern alternatif."
examples = ["procs   ← renkli süreç listesi", "procs $(whoami)   ← kendi süreçlerin", "procs --help"]

[[tools]]
id = "btm"
name = "bottom (btm)"
category = "Sistem ve Kaynak Kullanımı"
executable = "btm"
description = "Grafiksel sistem izleyici; btop'a alternatif."
alternative_to = "btop"
examples = ["btm   ← bottom sistem izleyici", "btm --help", "İpucu: btop alternatifidir"]

[[tools]]
id = "dust"
name = "dust"
category = "Sistem ve Kaynak Kullanımı"
executable = "dust"
description = "Dizinlerin disk kullanımını ağaç biçiminde sıralar."
examples = ["dust   ← dizin boyutu ağacı", "dust ~   ← ev dizininde", "dust -d 2   ← derinlik sınırı"]

[[tools]]
id = "duf"
name = "duf"
category = "Sistem ve Kaynak Kullanımı"
executable = "duf"
description = "Diskleri ve doluluk oranlarını tablo hâlinde gösterir."
examples = ["duf   ← disk doluluk tablosu", "duf --help", "İpucu: yalnızca bağlanmış dosya sistemleri"]
