# Nova mağaza kataloğu.
#
# Bu dosya, Nova'nın kullanıcı alanına kurabileceği ancak henüz Nova ile
# gelenekleştirilmemiş uygulamaların listesini tutar. Mağaza kataloğu,
# uygulamanın mevcut araç kataloğundan (`assets/catalog.toml`) ayrı tutulur.
#
# Bu dosya uygulamayla birlikte gelir ve derleme sırasında ikiliye gömülür;
# kullanıcı bunu düzenlemez. Güncellemeler bu dosyayı değiştirebilir.
#
# Alanlar:
#   id                Zorunlu, benzersiz kimlik (birleştirme anahtarı).
#   name              Uygulama adı.
#   description       Türkçe kısa açıklama.
#   category          STORE_CATEGORIES listesinden biri (aşağıda).
#   source            Kaynak/proje sayfası.
#   license           Lisans bilgisi.
#   executable        Kurulumdan sonra çalıştırılacak executable adı.
#   install_method    manual | download_archive
#                     manual: Nova kurulum yapmaz, sadece resmî talimatı gösterir.
#                     download_archive: Nova indirir, SHA-256 ile doğrular ve
#                     kullanıcı alanına çıkarır.
#   supported_platforms Desteklenen platformlar (ör. "linux-x64").
#   version           Kurulacak sürüm (download_archive için zorunlu).
#   download_url      İndirilecek arşivin https:// adresi (download_archive için
#                     zorunlu).
#   checksum          SHA-256 doğrulama özeti (download_archive için zorunlu).
#   checksum_type     Checksum türü (ör. "sha256").
#   install_notes     manual yöntemde gösterilen resmî kurulum yönergesi.
#   release           Canlı sürüm takibi (GitHub Releases).
#                     repo             İzlenecek depo ("owner/repo").
#                     tag_prefix       Sürüm etiketindeki ön ek (ör. "v").
#                     asset_pattern    Sürüm arşivinin adı; {version} sürümle değişir.
#                     checksum_asset_pattern
#                     Checksum dosyasının adı; {version} sürümle değişir.
#                     Verilmezse özet yayın notlarından okunur.
#
# Canlı takip "uzaktan gelen katalog" değildir: depo ve dosya adı desenleri
# burada sabittir, ağdan yalnızca sürüm ipucu gelir. Çalıştırılacak dosyanın
# bütünlüğü upstream'in kendi yayımladığı SHA-256 özetiyle korunur.
#
# Kategoriler:
#   AI, Git, Dosya ve Arama, Geliştirme, Editörler, Sistem, Ağ, Konteyner,
#   Veritabanı, Güvenlik, Medya, Mesajlaşma, Verimlilik, Oyunlar, Web, Günlük
#
# Güvenlik: Nova kurulumu yalnızca kullanıcı alanına yapar, `sudo`/root istemez,
# sistem dizinlerine yazmaz, sistem paket yöneticisini kullanmaz ve varsayılan
# olarak uzaktan indirilen betikleri shell üzerinden çalıştırmaz.
#
# `download_archive` kayıtlarında adres ve SHA-256 özeti birlikte zorunludur:
# doğrulanamayan bir indirme için "Kur" eylemi sunulmaz. Aşağıdaki özetler
# upstream'in kendi yayın checksum'larından alınmış ve indirilen dosyanın
# özetiyle birebir karşılaştırılarak doğrulanmıştır.

